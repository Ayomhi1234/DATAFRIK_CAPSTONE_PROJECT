version: 2

models:
  - name: stg_stock_prices
    columns:
      - name: price_date
        data_tests:
          - not_null
      - name: ticker
        data_tests:
          - not_null

  - name: stg_trades
    columns:
      - name: trade_id
        data_tests:
          - not_null
          - unique
      - name: ticker
        data_tests:
          - not_null

  - name: stg_exchange_rates
    columns:
      - name: rate_date
        data_tests:
          - not_null
      - name: rate
        data_tests:
          - not_null